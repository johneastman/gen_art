<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Home</h1>

    <h2>Generate a Planet</h2>
    <ul>
        <li><a href="/planet">Planet</a></li>
    </ul>

    <h2>Generate a Circle</h2>
    <ul>
        <li><a href="/circle?tile=circle">Circular Tiles</a></li>
        <li><a href="/circle?tile=square">Square Tiles</a></li>
    </ul>

    <h2>Static Images</h2>
    <ul>
        {% for filename in images %}
            <li><a href="/image/{{ filename }}">{{ filename }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
