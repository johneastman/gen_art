<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Home</h1>

    <h2>Generate a Planet</h2>
    <ul>
        <li><a href="/planet">Planet</a></li>
    </ul>

    <h2>Generate a Circle</h2>

    <h3>Tiles</h3>
    <form action="/circle" method="post">
        <input type="radio" id="circle" name="tile" value="circle" checked>
        <label for="circle">Circular</label><br>

        <input type="radio" id="square" name="tile" value="square">
        <label for="square">Square</label><br><br>

        <button type="submit">Generate</button>
    </form>

    <h2>Static Images</h2>
    <ul>
        {% for filename in images %}
            <li><a href="/image/{{ filename }}">{{ filename }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
